<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH 시지프스 — 관제 대시보드</title>
  <script src="/node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>
  <script>
    // UMD가 var supabase로 선언 → let supabase와 충돌 방지용 저장
    window.__supabaseLib__ = supabase;
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c10;
      --surface:   #111318;
      --border:    #1e2130;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #7c3aed;
      --green:     #22c55e;
      --yellow:    #eab308;
      --blue:      #3b82f6;
      --red:       #ef4444;
      --orange:    #f97316;
      --font:      'Fira Code', 'Cascadia Code', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 헤더 ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    .status-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-pill.connected .dot { background: var(--green); }
    .status-pill.connected { color: var(--green); }

    /* ── 레이아웃 ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 12px;
    }

    /* ── 카드 ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .card-header strong {
      color: var(--text);
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
    }
    .card-body {
      padding: 10px;
      max-height: 420px;
      overflow-y: auto;
    }
    .card-body::-webkit-scrollbar { width: 4px; }
    .card-body::-webkit-scrollbar-track { background: transparent; }
    .card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── 에이전트 로그 ── */
    .log-row {
      display: grid;
      grid-template-columns: 72px 60px 76px 1fr;
      gap: 6px;
      align-items: start;
      padding: 4px 0;
      border-bottom: 1px solid #151821;
      line-height: 1.5;
    }
    .log-row:last-child { border-bottom: none; }
    .log-time  { color: var(--muted); font-size: 11px; }
    .log-agent { color: #a78bfa; }
    .log-state { font-size: 11px; }
    .log-state.idle      { color: var(--muted); }
    .log-state.thinking  { color: var(--yellow); }
    .log-state.executing { color: var(--blue); }
    .log-state.done      { color: var(--green); }
    .log-state.error     { color: var(--red); }
    .log-msg { color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--muted);
      gap: 8px;
      font-size: 12px;
      text-align: center;
    }
    .empty-state .icon { font-size: 28px; opacity: 0.5; }

    /* ── Todo 진행률 ── */
    .progress-bar-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .progress-meta span:last-child { color: var(--green); }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .todo-row {
      display: grid;
      grid-template-columns: 20px 60px 1fr;
      gap: 6px;
      align-items: start;
      padding: 5px 14px;
      border-bottom: 1px solid #151821;
      font-size: 12px;
    }
    .todo-row:last-child { border-bottom: none; }
    .todo-icon { text-align: center; font-size: 13px; }
    .todo-agent { color: var(--muted); font-size: 11px; padding-top: 1px; }
    .todo-content { color: var(--text); }
    .todo-content.completed { color: var(--muted); text-decoration: line-through; }

    /* ── 에이전트 상태 카드 (우측 하단) ── */
    .agents-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
    }
    .agent-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }
    .agent-pill .indicator {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .agent-pill.idle     .indicator { background: var(--muted); }
    .agent-pill.thinking .indicator { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1s infinite; }
    .agent-pill.executing .indicator { background: var(--blue); box-shadow: 0 0 6px var(--blue); animation: pulse 0.8s infinite; }
    .agent-pill.done     .indicator { background: var(--green); }
    .agent-pill.error    .indicator { background: var(--red); }

    .agent-name { font-size: 12px; color: var(--text); flex: 1; }
    .agent-state-label { font-size: 10px; color: var(--muted); }

    /* ── 설정 배너 ── */
    #config-banner {
      display: none;
      margin: 8px 12px 0;
      padding: 10px 14px;
      background: #1a1200;
      border: 1px solid #422006;
      border-radius: 6px;
      color: #fbbf24;
      font-size: 12px;
    }
    #config-banner a { color: var(--orange); }
  </style>
</head>
<body>

<!-- ── 헤더 ── -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    JH 시지프스 관제
  </div>
  <div id="conn-status" class="status-pill">
    <div class="dot"></div>
    <span>연결 중...</span>
  </div>
</header>

<!-- ── 설정 배너 ── -->
<div id="config-banner">
  Supabase 미설정: <code>.env</code> 파일에 <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>를 추가하고 서버를 재시작하세요.
</div>

<!-- ── 메인 ── -->
<main>

  <!-- 에이전트 로그 (좌상단 + 좌하단 span) -->
  <div class="card" style="grid-row: 1 / 3;">
    <div class="card-header">
      <strong>에이전트 로그</strong>
      <span id="log-count">0 항목</span>
    </div>
    <div class="card-body" id="log-list">
      <div class="empty-state">
        <div class="icon">🤖</div>
        <div>대기 중 — Claude Code에서 /project:ultrawork 를 실행하세요</div>
      </div>
    </div>
  </div>

  <!-- Todo 진행률 (우상단) -->
  <div class="card">
    <div class="card-header">
      <strong>Todo 진행률</strong>
      <span id="todo-session" style="font-size:11px;color:var(--muted)">세션 없음</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-meta">
        <span>진행률</span>
        <span id="todo-pct">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="card-body" id="todo-list" style="max-height:280px;">
      <div class="empty-state">
        <div class="icon">📋</div>
        <div>작업 목록 없음</div>
      </div>
    </div>
  </div>

  <!-- 에이전트 상태 (우하단) -->
  <div class="card">
    <div class="card-header">
      <strong>에이전트 상태</strong>
    </div>
    <div class="agents-grid" id="agents-grid">
      <!-- JS로 채움 -->
    </div>
  </div>

</main>

<script>
// ─────────────────────────────────────────────
// 상태
// ─────────────────────────────────────────────
const AGENTS = ['sisyphus', 'scout', 'prometheus', 'oracle', 'verifier'];
let supabaseClient = null;
let agentStates = Object.fromEntries(AGENTS.map(a => [a, 'idle']));
let logs = [];
let todos = [];

// ─────────────────────────────────────────────
// 헬퍼
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('ko-KR', { hour12: false });
}

function stateEmoji(state) {
  return { idle: '⬜', thinking: '🟡', executing: '🔵', done: '✅', error: '🔴' }[state] ?? '⬜';
}

function todoIcon(status) {
  return { completed: '✅', in_progress: '🔄', pending: '⬜' }[status] ?? '⬜';
}

// ─────────────────────────────────────────────
// 렌더링
// ─────────────────────────────────────────────
function renderLogs() {
  const el = $('log-list');
  if (logs.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🤖</div><div>대기 중 — Claude Code에서 /project:ultrawork 를 실행하세요</div></div>`;
    $('log-count').textContent = '0 항목';
    return;
  }
  $('log-count').textContent = `${logs.length} 항목`;
  el.innerHTML = logs.map(log => `
    <div class="log-row">
      <span class="log-time">${fmtTime(log.ts)}</span>
      <span class="log-agent">${log.agent}</span>
      <span class="log-state ${log.state}">${log.state}</span>
      <span class="log-msg" title="${log.todo ?? log.message ?? ''}">${log.todo ?? log.message ?? ''}</span>
    </div>
  `).join('');
}

function renderTodos() {
  const el = $('todo-list');
  if (todos.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>작업 목록 없음</div></div>`;
    $('todo-pct').textContent = '0 / 0 (0%)';
    $('progress-fill').style.width = '0%';
    return;
  }
  const done = todos.filter(t => t.status === 'completed').length;
  const pct = Math.round(done / todos.length * 100);
  $('todo-pct').textContent = `${done} / ${todos.length} (${pct}%)`;
  $('progress-fill').style.width = `${pct}%`;
  el.innerHTML = todos.map(t => `
    <div class="todo-row">
      <span class="todo-icon">${todoIcon(t.status)}</span>
      <span class="todo-agent">${t.agent ?? ''}</span>
      <span class="todo-content ${t.status === 'completed' ? 'completed' : ''}">${t.content}</span>
    </div>
  `).join('');
}

function renderAgents() {
  const el = $('agents-grid');
  el.innerHTML = AGENTS.map(name => {
    const state = agentStates[name] ?? 'idle';
    return `
      <div class="agent-pill ${state}">
        <div class="indicator"></div>
        <span class="agent-name">${name}</span>
        <span class="agent-state-label">${state}</span>
      </div>
    `;
  }).join('');
}

function setConnected(ok) {
  const el = $('conn-status');
  if (ok) {
    el.className = 'status-pill connected';
    el.innerHTML = '<div class="dot"></div><span>Supabase 연결됨</span>';
  } else {
    el.className = 'status-pill';
    el.innerHTML = '<div class="dot"></div><span>미연결</span>';
  }
}

// ─────────────────────────────────────────────
// Supabase 초기화
// ─────────────────────────────────────────────
async function initSupabase() {
  // 1순위: Electron preload (contextBridge)
  // 2순위: /api/config fetch
  let cfg = { supabase_url: '', supabase_anon_key: '' };

  if (window.electronAPI?.supabaseUrl) {
    cfg.supabase_url = window.electronAPI.supabaseUrl;
    cfg.supabase_anon_key = window.electronAPI.supabaseAnonKey;
  } else {
    try {
      const res = await fetch('/api/config');
      if (res.ok) cfg = await res.json();
    } catch (e) {
      console.error('[config] fetch 실패:', e);
    }
  }

  if (!cfg.supabase_url || !cfg.supabase_anon_key) {
    $('config-banner').style.display = 'block';
    setConnected(false);
    renderLogs(); renderTodos(); renderAgents();
    return;
  }

  try {
    const lib = window.__supabaseLib__;
    if (!lib?.createClient) throw new Error('supabase-js 로드 실패');
    supabaseClient = lib.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  } catch (e) {
    console.error('[Supabase] createClient 실패:', e);
    setConnected(false);
    return;
  }
  setConnected(true);
  $('config-banner').style.display = 'none';

  await loadInitialData();
  subscribeRealtime();
}

// ─────────────────────────────────────────────
// 초기 데이터 로드
// ─────────────────────────────────────────────
async function loadInitialData() {
  // 최근 50개 로그
  const { data: logData } = await supabaseClient
    .from('agent_logs')
    .select('*')
    .order('ts', { ascending: false })
    .limit(50);
  if (logData) {
    logs = logData;
    // 에이전트 상태 최신화
    for (const log of logData) {
      if (AGENTS.includes(log.agent)) agentStates[log.agent] = log.state;
    }
  }

  // 가장 최근 세션 todos
  const { data: sessionData } = await supabaseClient
    .from('todos')
    .select('session_id')
    .order('created_at', { ascending: false })
    .limit(1);
  if (sessionData && sessionData.length > 0) {
    const sid = sessionData[0].session_id;
    $('todo-session').textContent = `세션: ${sid.slice(0, 8)}...`;
    const { data: todoData } = await supabaseClient
      .from('todos')
      .select('*')
      .eq('session_id', sid)
      .order('created_at');
    if (todoData) todos = todoData;
  }

  renderLogs(); renderTodos(); renderAgents();
}

// ─────────────────────────────────────────────
// Realtime 구독
// ─────────────────────────────────────────────
function subscribeRealtime() {
  // agent_logs
  supabaseClient
    .channel('agent_logs_rt')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'agent_logs' },
      ({ new: row }) => {
        logs.unshift(row);
        if (logs.length > 100) logs.pop();
        if (AGENTS.includes(row.agent)) agentStates[row.agent] = row.state;
        renderLogs(); renderAgents();
      }
    )
    .subscribe();

  // todos
  supabaseClient
    .channel('todos_rt')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'todos' },
      async () => {
        // 현재 세션 다시 로드
        const { data: sessionData } = await supabaseClient
          .from('todos').select('session_id')
          .order('created_at', { ascending: false }).limit(1);
        if (sessionData && sessionData.length > 0) {
          const sid = sessionData[0].session_id;
          $('todo-session').textContent = `세션: ${sid.slice(0, 8)}...`;
          const { data: todoData } = await supabaseClient
            .from('todos').select('*')
            .eq('session_id', sid).order('created_at');
          if (todoData) todos = todoData;
          renderTodos();
        }
      }
    )
    .subscribe();
}

// ─────────────────────────────────────────────
// 시작
// ─────────────────────────────────────────────
renderAgents(); // 초기 에이전트 목록 (idle 상태)
initSupabase();
</script>
</body>
</html>
